- slug: vitrine-de-produtos
  title: A vitrine de produtos
  difficulty: medio
  statement: |
    A loja lista todos os produtos de `merch`. Alguns são do próprio festival e têm `band_id` nulo.

    Partindo de `bands` e usando `RIGHT JOIN` com `merch`, retorne o `item` e o nome da banda. Produtos sem banda mostram `Festival`. Ordene pelo `item`.
  ordered: true
  must_use: [RIGHT JOIN]
  solution: |
    SELECT m.item, COALESCE(b.name, 'Festival') AS origem
    FROM bands b
    RIGHT JOIN merch m ON m.band_id = b.id
    ORDER BY m.item;
  hints:
    - RIGHT JOIN mantém todas as linhas da tabela escrita depois dele.
  explanation: |
    RIGHT JOIN é um LEFT JOIN com as tabelas invertidas. Por isso, muita gente prefere escrever sempre LEFT JOIN. O importante é reconhecer os dois em código alheio.
  traps:
    - reason: Sem Festival nos produtos sem banda
      sql: SELECT m.item, b.name FROM bands b RIGHT JOIN merch m ON m.band_id = b.id ORDER BY m.item;
    - reason: INNER JOIN esconde produtos do festival
      sql: SELECT m.item, COALESCE(b.name, 'Festival') FROM bands b JOIN merch m ON m.band_id = b.id ORDER BY m.item;

- slug: sem-par-dos-dois-lados
  title: Sem par dos dois lados
  difficulty: medio
  statement: |
    O comercial quer duas listas em uma só: bandas sem nenhum produto e produtos sem nenhuma banda.

    Use `FULL OUTER JOIN` entre `bands` e `merch`. Retorne o nome da banda e o `item`, e deixe nulo o lado sem par. Ordene por nome da banda e depois por `item`. No SQLite, nulos vêm primeiro.
  ordered: true
  must_use: [FULL]
  solution: |
    SELECT b.name, m.item
    FROM bands b
    FULL OUTER JOIN merch m ON m.band_id = b.id
    WHERE b.id IS NULL OR m.id IS NULL
    ORDER BY b.name, m.item;
  hints:
    - FULL OUTER JOIN traz os pares e também os sem par dos dois lados. Como manter só os sem par?
  explanation: |
    FULL OUTER JOIN preenche com NULL o lado que falta. Filtrar pelas chaves é seguro, porque uma chave primária nunca é nula em uma linha real. Esse formato é ótimo para encontrar diferenças entre duas tabelas.
  traps:
    - reason: Inclui os pares
      sql: SELECT b.name, m.item FROM bands b FULL OUTER JOIN merch m ON m.band_id = b.id ORDER BY b.name, m.item;
    - reason: Só um dos lados
      sql: SELECT b.name, m.item FROM bands b FULL OUTER JOIN merch m ON m.band_id = b.id WHERE m.id IS NULL ORDER BY b.name, m.item;

- slug: grade-de-possibilidades
  title: Todas as combinações
  difficulty: medio
  statement: |
    A curadoria quer avaliar cada casa com cada gênero musical cadastrado.

    Retorne todas as combinações de `venues.name` com cada gênero de `bands`, sem repetir gênero. Ordene pelo nome da casa e depois pelo gênero.
  ordered: true
  solution: |
    SELECT v.name, g.genre
    FROM venues v
    CROSS JOIN (SELECT DISTINCT genre FROM bands) g
    ORDER BY v.name, g.genre;
  hints:
    - CROSS JOIN combina cada linha de um lado com todas do outro.
    - Se `bands` tem dois thrash, quantas vezes cada casa aparece com thrash?
  explanation: |
    O resultado tem casas vezes gêneros linhas. CROSS JOIN é útil para gerar grades, mas cresce rápido. Um JOIN que esquece a condição ON pode virar um CROSS JOIN sem ninguém perceber.
  traps:
    - reason: Gêneros repetidos
      sql: SELECT v.name, b.genre FROM venues v CROSS JOIN bands b ORDER BY v.name, b.genre;
    - reason: Só gêneros que têm show na casa
      sql: SELECT DISTINCT v.name, b.genre FROM venues v JOIN shows s ON s.venue_id = v.id JOIN bands b ON b.id = s.band_id ORDER BY v.name, b.genre;

- slug: distancia-da-media
  title: Longe da média
  difficulty: medio
  statement: |
    Para cada show, retorne o `id`, o `ticket_price` e a diferença entre esse preço e a média geral de preços de todos os shows, arredondada para 2 casas. Ordene pelo `id`.
  ordered: true
  solution: |
    SELECT
      id,
      ticket_price,
      ROUND(ticket_price - (SELECT AVG(ticket_price) FROM shows), 2) AS diferenca
    FROM shows
    ORDER BY id;
  hints:
    - Misturar AVG com colunas comuns, sem subquery, colapsa tudo em uma linha.
  explanation: |
    Uma subquery escalar devolve um único valor e pode ser usada onde caberia uma constante. Ela não pode devolver mais de uma linha, e em muitos bancos isso gera erro.
  traps:
    - reason: AVG sem subquery colapsa as linhas
      sql: SELECT id, ticket_price, ROUND(ticket_price - AVG(ticket_price), 2) FROM shows ORDER BY id;
    - reason: Média digitada à mão
      sql: SELECT id, ticket_price, ROUND(ticket_price - 154.58, 2) FROM shows ORDER BY id;

- slug: quem-tocou-na-arena
  title: Quem toca na Arena Tupi?
  difficulty: medio
  statement: |
    Liste o `name` das bandas com pelo menos um show na casa `Arena Tupi`, em ordem alfabética.

    Resolva só com subqueries, sem `JOIN`.
  ordered: true
  forbid: [JOIN]
  solution: |
    SELECT name
    FROM bands
    WHERE id IN (
      SELECT band_id
      FROM shows
      WHERE venue_id IN (
        SELECT id
        FROM venues
        WHERE name = 'Arena Tupi'
      )
    )
    ORDER BY name;
  hints:
    - Trabalhe de dentro para fora. Primeiro ache o id da casa, depois as bandas dos shows dela.
    - A subquery de bandas devolve várias linhas. Qual operador aceita uma lista?
  explanation: |
    A subquery devolve uma coluna com vários valores, e IN verifica se o id está entre eles. Uma banda com dois shows na casa aparece uma vez só. Na versão com JOIN, ela apareceria duas vezes e precisaria de DISTINCT.
  traps:
    - reason: Igualdade compara só com o primeiro valor
      sql: SELECT name FROM bands WHERE id = (SELECT band_id FROM shows WHERE venue_id IN (SELECT id FROM venues WHERE name = 'Arena Tupi')) ORDER BY name;
    - reason: ID fixo não vale em outros dados
      sql: SELECT name FROM bands WHERE id IN (SELECT band_id FROM shows WHERE venue_id = 1) ORDER BY name;

- slug: mesma-banda-mesmo-preco
  title: Mesma banda, mesmo preço
  difficulty: medio
  statement: |
    Encontre o show com o ingresso mais caro. Em caso de empate no preço, vale o de menor `id`.

    Depois, liste todos os shows com a mesma banda e o mesmo preço desse show, inclusive ele próprio. Retorne `id` e `show_date`, ordenados por `id`.
  ordered: true
  solution: |
    SELECT id, show_date
    FROM shows
    WHERE (band_id, ticket_price) = (
      SELECT band_id, ticket_price
      FROM shows
      ORDER BY ticket_price DESC, id
      LIMIT 1
    )
    ORDER BY id;
  hints:
    - Dá para comparar dois valores de uma vez, escrevendo `(a, b) = (SELECT x, y ...)`.
  explanation: |
    Uma subquery de linha devolve uma linha com várias colunas. A comparação só é verdadeira quando todas batem, o que é mais curto que repetir uma subquery para cada coluna.
  traps:
    - reason: Devolve só um show e ignora empates
      sql: SELECT id, show_date FROM shows ORDER BY ticket_price DESC, id LIMIT 1;
    - reason: Compara só a banda
      sql: SELECT id, show_date FROM shows WHERE band_id = (SELECT band_id FROM shows ORDER BY ticket_price DESC, id LIMIT 1) ORDER BY id;

- slug: media-de-publico
  title: Média de público por show
  difficulty: dificil
  statement: |
    Para cada banda com show, calcule a média de ingressos pagos por show, arredondada para 2 casas. Um show sem venda paga conta como 0 na média.

    Retorne o nome da banda e a média, ordenados pelo nome da banda.
  ordered: true
  solution: |
    SELECT b.name, ROUND(AVG(v.vendidos), 2) AS media
    FROM (
      SELECT s.id, s.band_id, COALESCE(SUM(t.quantity), 0) AS vendidos
      FROM shows s
      LEFT JOIN tickets t ON t.show_id = s.id AND t.status = 'pago'
      GROUP BY s.id
    ) v
    JOIN bands b ON b.id = v.band_id
    GROUP BY b.id
    ORDER BY b.name;
  hints:
    - São duas agregações, uma sobre a outra. Primeiro o total por show, depois a média por banda.
    - Agregações não podem ser aninhadas diretamente, como em AVG(SUM(x)).
  explanation: |
    Uma subquery no FROM funciona como uma tabela temporária. A armadilha é tirar a média direto de `quantity`, que daria a média por pedido, não por show.
  traps:
    - reason: Média por pedido, não por show
      sql: SELECT b.name, ROUND(AVG(t.quantity), 2) FROM shows s JOIN bands b ON b.id = s.band_id LEFT JOIN tickets t ON t.show_id = s.id AND t.status = 'pago' GROUP BY b.id ORDER BY b.name;
    - reason: Ignora shows sem venda
      sql: SELECT b.name, ROUND(AVG(v.q), 2) FROM (SELECT s.id, s.band_id, SUM(t.quantity) AS q FROM shows s JOIN tickets t ON t.show_id = s.id AND t.status = 'pago' GROUP BY s.id) v JOIN bands b ON b.id = v.band_id GROUP BY b.id ORDER BY b.name;
