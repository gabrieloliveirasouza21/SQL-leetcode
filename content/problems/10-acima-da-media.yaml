slug: acima-da-media
title: Caro para os próprios padrões
difficulty: medio
statement: |
  Um ingresso de 180 pode ser barato para uma banda e caríssimo para outra. A equipe quer achar os shows mais caros que a média da própria banda.

  Retorne o nome da banda, a data e o preço dos shows com `ticket_price` estritamente acima da média dos shows daquela banda. Ordene por nome da banda e depois por data.
ordered: true
solution: |
  SELECT b.name, s.show_date, s.ticket_price
  FROM shows s
  JOIN bands b ON b.id = s.band_id
  WHERE s.ticket_price > (
    SELECT AVG(o.ticket_price)
    FROM shows o
    WHERE o.band_id = s.band_id
  )
  ORDER BY b.name, s.show_date;
hints:
  - A média muda de linha para linha, porque depende da banda daquele show.
  - Uma subquery pode usar colunas da query de fora.
explanation: |
  A subquery correlacionada é recalculada para cada linha externa, por causa da referência a `s.band_id`. Sem ela, a média seria uma só para todos os shows, e bandas com ingressos baratos nunca apareceriam.
traps:
  - reason: Usa a média global, não a da banda
    sql: SELECT b.name, s.show_date, s.ticket_price FROM shows s JOIN bands b ON b.id = s.band_id WHERE s.ticket_price > (SELECT AVG(ticket_price) FROM shows) ORDER BY b.name, s.show_date;
  - reason: Inclui shows exatamente na média
    sql: SELECT b.name, s.show_date, s.ticket_price FROM shows s JOIN bands b ON b.id = s.band_id WHERE s.ticket_price >= (SELECT AVG(o.ticket_price) FROM shows o WHERE o.band_id = s.band_id) ORDER BY b.name, s.show_date;
