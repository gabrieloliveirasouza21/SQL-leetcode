slug: primeiro-show-da-banda
title: Desde quando na estrada?
difficulty: medio
statement: |
  Na página de cada show, queremos lembrar quando a banda fez seu primeiro show no festival.

  Para cada show, retorne o nome da banda, a data e a data do primeiro show daquela banda. O primeiro show é definido por data e, em caso de empate, pelo `id` do show. Ordene por nome da banda, data e `id` do show.
ordered: true
solution: |
  SELECT
    b.name,
    s.show_date,
    FIRST_VALUE(s.show_date) OVER (
      PARTITION BY s.band_id
      ORDER BY s.show_date, s.id
    ) AS primeiro
  FROM shows s
  JOIN bands b ON b.id = s.band_id
  ORDER BY b.name, s.show_date, s.id;
hints:
  - FIRST_VALUE lê o valor da primeira linha da janela e repete esse valor em todas as linhas.
  - A janela precisa de uma partição por banda e de uma ordem.
explanation: |
  FIRST_VALUE evita uma subquery correlacionada por linha. Seu par, LAST_VALUE, tem uma armadilha: por padrão, a janela termina na linha atual, então ele devolve o valor da própria linha, a menos que você declare `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`.
traps:
  - reason: Sem PARTITION BY, usa o primeiro show de todas as bandas
    sql: SELECT b.name, s.show_date, FIRST_VALUE(s.show_date) OVER (ORDER BY s.show_date, s.id) FROM shows s JOIN bands b ON b.id = s.band_id ORDER BY b.name, s.show_date, s.id;
  - reason: LAST_VALUE com janela padrão devolve a própria linha
    sql: SELECT b.name, s.show_date, LAST_VALUE(s.show_date) OVER (PARTITION BY s.band_id ORDER BY s.show_date, s.id) FROM shows s JOIN bands b ON b.id = s.band_id ORDER BY b.name, s.show_date, s.id;
  - reason: Ordem invertida traz o último show
    sql: SELECT b.name, s.show_date, FIRST_VALUE(s.show_date) OVER (PARTITION BY s.band_id ORDER BY s.show_date DESC, s.id DESC) FROM shows s JOIN bands b ON b.id = s.band_id ORDER BY b.name, s.show_date, s.id;
